[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gustflow"
version = "0.1.0"
description = "CUDA-accelerated rotated Gaussian splatting for phase unwrapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py",
  "matplotlib",
  "numpy",
  "torch",
  "cupy-cuda13x>=14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gustflow*"]

[tool.setuptools.package-data]
gustflow = ["*.cu"]
